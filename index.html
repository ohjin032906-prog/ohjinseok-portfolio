<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#102a50"><title>오진석 | 청소년복지 포트폴리오</title>
<style>
:root{font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;color:#183254;background:#f3f7fc}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}a{color:inherit}.shell{max-width:960px;margin:auto;padding:28px 22px 64px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 32px}.brand{font-size:12px;font-weight:800;letter-spacing:.19em;color:#31577e}.head-actions{display:flex;align-items:center;gap:10px}.small{font-size:12px;color:#6681a0}.btn{border:1px solid #cedbea;background:white;border-radius:11px;padding:10px 15px;font-weight:650;color:#183254}.btn.primary{background:#173c72;color:white;border-color:#173c72}.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #94c5fe;outline-offset:2px}.hero{background:linear-gradient(120deg,#122a4c,#204b83);color:white;border-radius:28px;overflow:hidden;position:relative;padding:65px 60px 58px;isolation:isolate}.hero:before{content:"";position:absolute;z-index:-1;width:460px;height:460px;border:1px solid #ffffff3b;border-radius:50%;right:-140px;top:-170px;box-shadow:0 0 0 70px #ffffff09,0 0 0 140px #ffffff08}.eyebrow{font-size:12px;letter-spacing:.2em;color:#c4dafa;font-weight:700}.hero h1{font-size:clamp(44px,7vw,76px);letter-spacing:-.07em;margin:22px 0 5px}.role{font-size:23px;font-weight:600}.affil{color:#c9d9ee;margin:14px 0 0}.motto{font-size:clamp(19px,3vw,29px);font-weight:650;line-height:1.55;margin:44px 0 30px;max-width:620px;word-break:keep-all}.contacts{display:flex;flex-wrap:wrap;gap:12px}.contacts a{font-size:13px;text-decoration:none;border:1px solid #ffffff5c;border-radius:100px;padding:10px 14px}.section{padding:49px 9px 12px}.section h2{font-size:27px;letter-spacing:-.06em}.sub{font-size:11px;color:#7995b3;letter-spacing:.17em;margin-left:9px}.jobs{display:grid;gap:12px}.job{background:#fff;border:1px solid #e2eaf5;padding:22px 24px;border-radius:17px;display:flex;justify-content:space-between;gap:15px}.job h3{font-size:17px;letter-spacing:-.04em;margin:0 0 7px}.job p{margin:4px 0;color:#6b809b;font-size:14px}.period{font-size:13px;white-space:nowrap;color:#57759b}.skills{display:flex;flex-wrap:wrap;gap:11px}.skill{background:#e5edf9;color:#214a78;border-radius:50px;padding:13px 19px;font-weight:600;font-size:14px}.closing{text-align:center;color:#456488;padding:64px 12px 20px;line-height:1.9}.adminbox{background:white;border:1px solid #d9e6f3;border-radius:18px;margin:0 0 22px;padding:23px}.adminbox h2{margin:0 0 10px}.adminbox p{font-size:13px;color:#617b9b}.hidden{display:none!important}.field{margin:16px 0}.field label{display:block;color:#34516f;font-size:13px;margin-bottom:8px;font-weight:700}.field input,.field textarea{display:block;width:100%;padding:11px 12px;border-radius:10px;border:1px solid #cbd8e7;background:white}.field textarea{min-height:85px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.editjob{border-top:1px solid #e2e9f1;margin:24px 0;padding-top:12px}.editjob h3{font-size:15px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}.message{font-size:13px;min-height:20px;color:#315f88}.footer{text-align:center;font-size:12px;color:#7991aa;padding:20px}
@media(max-width:640px){.shell{padding:14px 15px 42px}.hero{border-radius:22px;padding:51px 27px 46px}.hero:before{right:-260px}.hero h1{margin-top:16px}.motto{margin:31px 0 24px}.job{display:block}.period{display:block;margin-top:11px}.section{padding-top:35px}.grid{grid-template-columns:1fr}.btn{padding:9px 10px}.small{display:none}}
</style></head><body><div class="shell"><header><div class="brand">OH JIN SEOK · PORTFOLIO</div><div class="head-actions"><span class="small" id="status">공개 포트폴리오</span><button class="btn" id="openLogin">관리자</button><button class="btn hidden" id="logout">로그아웃</button></div></header>
<section class="adminbox hidden" id="loginPanel"><h2>관리자 로그인</h2><p>관리자 계정만 편집할 수 있습니다.</p><div class="grid"><div class="field"><label for="loginEmail">이메일</label><input id="loginEmail" type="email" autocomplete="username"></div><div class="field"><label for="loginPass">비밀번호</label><input id="loginPass" type="password" autocomplete="current-password"></div></div><button class="btn primary" id="login">로그인</button><p class="message" id="loginMsg"></p></section>
<section class="adminbox hidden" id="editPanel"><h2>포트폴리오 관리자 편집</h2><p>초안 저장은 비공개이며, 공개 게시는 누구나 볼 수 있는 내용을 변경합니다.</p><div id="editFields"></div><h2>경력</h2><div id="editJobs"></div><div class="actions"><button class="btn" id="saveDraft">초안 저장</button><button class="btn primary" id="publish">공개 게시</button><button class="btn" id="showPublished">공개 내용 보기</button></div><p class="message" id="editMsg"></p></section>
<main><section class="hero"><div class="eyebrow">YOUTH WELFARE PROFESSIONAL</div><h1 id="name">오진석</h1><div class="role" id="role"></div><p class="affil" id="affiliation"></p><p class="motto" id="motto"></p><div class="contacts"><a id="phone"></a><a id="email"></a></div></section><section class="section"><h2>주요 경력 <span class="sub">CAREER</span></h2><div class="jobs" id="jobs"></div></section><section class="section"><h2>전문 분야 <span class="sub">EXPERTISE</span></h2><div class="skills" id="skills"></div></section><div class="closing" id="closing"></div></main><footer class="footer">© OH JIN SEOK · PERSONAL PORTFOLIO</footer></div>
<script src="./config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const initial={name:"오진석",role:"청소년복지 전문가",affiliation:"現 수원여자단기청소년쉼터 팀원",motto:"사람과 지역이 함께 성장하는 청소년복지",phone:"010-9445-9833",email:"ohjin0306@naver.com",closing:"청소년의 가능성을 믿고, 함께 만들어가는 변화를 지향합니다.",skills:["청소년 상담 및 사례관리","프로그램 기획 및 운영","지역사회 연계 및 자원개발","행정 및 사업관리"],jobs:[{org:"수원시청소년청년재단",unit:"수원여자단기청소년쉼터(별보듬터)",role:"팀원",period:"2024.07.01 ~ 현재"},{org:"과천시청소년육성재단",unit:"학교밖청소년지원센터",role:"기간제 팀원",period:"2022.05.11 ~ 2023.12.31"},{org:"강남구청소년쉼터",unit:"",role:"생활지도원 / 사회복지사",period:"2014.05.01 ~ 2021.12.31"},{org:"금천교육복지센터",unit:"",role:"지역사회교육전문가",period:"2013.05.01 ~ 2014.02.28"},{org:"목동종합사회복지관",unit:"",role:"사회복지사",period:"2012.04.01 ~ 2013.02.28"}]};
const $=id=>document.getElementById(id),copy=v=>JSON.parse(JSON.stringify(v));const conf=window.PORTFOLIO_CONFIG||{};const db=window.supabase&&conf.url&&conf.anonKey?window.supabase.createClient(conf.url,conf.anonKey):null;let published=copy(initial),draft=copy(initial),isAdmin=false;
function e(tag,cls,t){let x=document.createElement(tag);if(cls)x.className=cls;if(t!==undefined)x.textContent=t;return x}
function render(d){for(const k of ["name","role","affiliation","motto","closing"])$(k).textContent=d[k]||""; $("phone").textContent="☎ "+(d.phone||"");$("phone").href="tel:"+(d.phone||"").replace(/[^+0-9]/g,"");$("email").textContent="✉ "+(d.email||"");$("email").href="mailto:"+(d.email||"");$("jobs").replaceChildren();(d.jobs||[]).forEach(j=>{const n=e("article","job"),left=e("div");left.append(e("h3","",j.org||""),e("p","",j.unit||""),e("p","",j.role||""));n.append(left,e("div","period",j.period||""));$("jobs").append(n)});$("skills").replaceChildren(...(d.skills||[]).map(s=>e("span","skill",s)))}
const fieldNames={name:"이름",role:"전문 직함",affiliation:"현재 소속",motto:"소개 문구",phone:"전화번호",email:"이메일",closing:"마무리 문구",skills:"전문 분야 (줄바꿈으로 구분)"};
function addField(to,label,value,key,textarea=false){const b=e("div","field"),l=e("label","",label),x=document.createElement(textarea?"textarea":"input");x.value=value||"";x.dataset.key=key;b.append(l,x);to.append(b)}
function editor(){const root=$("editFields");root.replaceChildren();Object.entries(fieldNames).forEach(([k,v])=>addField(root,v,k==="skills"?(draft.skills||[]).join("\n"):draft[k],k,["motto","closing","skills"].includes(k)));const jobs=$("editJobs");jobs.replaceChildren();(draft.jobs||[]).forEach((j,i)=>{const n=e("div","editjob");n.append(e("h3","",String(i+1)+". 경력"));const grid=e("div","grid");for(const [k,label] of [["org","기관명"],["unit","부서·소속"],["role","직책"],["period","기간"]])addField(grid,label,j[k],i+"."+k);n.append(grid);jobs.append(n)})}
function readEditor(){const next=copy(draft);document.querySelectorAll("#editPanel [data-key]").forEach(input=>{const k=input.dataset.key;if(k.includes(".")){const [i,f]=k.split(".");next.jobs[+i][f]=input.value.trim()}else if(k==="skills")next.skills=input.value.split("\n").map(s=>s.trim()).filter(Boolean);else next[k]=input.value.trim()});draft=next}
async function load(){if(!db){$("status").textContent="연결 설정 확인 필요";render(initial);return}const {data,error}=await db.rpc("get_published_portfolio");if(error){console.error(error);$("status").textContent="공개 내용 연결 오류"}else if(data&&Object.keys(data).length)published=data;render(published)}
async function checkAdmin(){if(!db)return;const {data:{user},error}=await db.auth.getUser();if(error||!user){isAdmin=false;$("logout").classList.add("hidden");$("openLogin").classList.remove("hidden");$("editPanel").classList.add("hidden");return}const p=await db.rpc("is_portfolio_admin");isAdmin=!p.error&&p.data===true;$("logout").classList.remove("hidden");$("openLogin").classList.add("hidden");$("loginPanel").classList.add("hidden");$("editPanel").classList.toggle("hidden",!isAdmin);$("status").textContent=isAdmin?"관리자 로그인됨":"편집 권한 없음";if(isAdmin){const r=await db.rpc("get_portfolio_draft");if(r.error){$("editMsg").textContent="초안 읽기 실패: "+r.error.message;return}draft=r.data&&Object.keys(r.data).length?r.data:copy(published);editor()}}
$("openLogin").onclick=()=>$("loginPanel").classList.toggle("hidden");
$("login").onclick=async()=>{if(!db){$("loginMsg").textContent="Supabase 연결을 확인해 주세요.";return}const email=$("loginEmail").value.trim(),password=$("loginPass").value;const {error}=await db.auth.signInWithPassword({email,password});$("loginPass").value="";if(error){$("loginMsg").textContent="로그인에 실패했습니다. 계정을 확인해 주세요.";return}await checkAdmin()};
$("logout").onclick=async()=>{if(db)await db.auth.signOut();isAdmin=false;$("editPanel").classList.add("hidden");$("logout").classList.add("hidden");$("openLogin").classList.remove("hidden");$("status").textContent="공개 포트폴리오";render(published)};
$("saveDraft").onclick=async()=>{if(!isAdmin)return;readEditor();const r=await db.rpc("save_portfolio_draft",{p_content:draft});$("editMsg").textContent=r.error?"초안 저장 실패: "+r.error.message:"초안 저장 완료 — 방문자에게는 보이지 않습니다."};
$("publish").onclick=async()=>{if(!isAdmin)return;readEditor();if(!confirm("현재 초안을 모든 방문자에게 공개할까요?"))return;const r=await db.rpc("publish_portfolio",{p_content:draft});if(r.error){$("editMsg").textContent="게시 실패: "+r.error.message;return}published=copy(draft);render(published);$("editMsg").textContent="공개 게시 완료"};
$("showPublished").onclick=()=>{render(published);$("editMsg").textContent="공개 버전을 표시합니다. 저장 중인 초안은 유지됩니다."};
render(initial);load().then(checkAdmin).catch(err=>{$("status").textContent="연결 오류";console.error(err)});
</script></body></html>
